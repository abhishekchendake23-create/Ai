services:
  - type: web
    name: abhynex-maya
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NVIDIA_API_KEY
        sync: false
      - key: APP_PASSCODE
        sync: false
      - key: NVIDIA_MODEL
        sync: false
      - key: SEARCH_API_KEY
        sync: false
